name: Build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/git-tree-target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check default build
        run: cargo check --locked --target ${{ matrix.target }}
      - name: Lint default build
        run: cargo clippy --locked --target ${{ matrix.target }} -- -D warnings
      - name: Build GUI and TUI
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Archive default binary
        shell: bash
        run: |
          mkdir -p dist "$RUNNER_TEMP/package"
          cp "$CARGO_TARGET_DIR/${{ matrix.target }}/release/git-tree" "$RUNNER_TEMP/package/git-tree"
          cp README.md "$RUNNER_TEMP/package/"
          tar -czf "dist/git-tree-${{ matrix.target }}.tar.gz" -C "$RUNNER_TEMP/package" git-tree README.md
      - name: Check TUI-only build
        run: cargo check --locked --no-default-features --target ${{ matrix.target }}
      - name: Lint TUI-only build
        run: cargo clippy --locked --no-default-features --target ${{ matrix.target }} -- -D warnings
      - name: Build TUI-only binary
        run: cargo build --locked --release --no-default-features --target ${{ matrix.target }}
      - name: Archive TUI-only binary
        shell: bash
        run: |
          cp "$CARGO_TARGET_DIR/${{ matrix.target }}/release/git-tree" "$RUNNER_TEMP/package/git-tree"
          tar -czf "dist/git-tree-${{ matrix.target }}-tui.tar.gz" -C "$RUNNER_TEMP/package" git-tree README.md
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum *.tar.gz > "git-tree-${{ matrix.target }}-SHA256SUMS"
          else
            shasum -a 256 *.tar.gz > "git-tree-${{ matrix.target }}-SHA256SUMS"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: git-tree-${{ matrix.target }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
