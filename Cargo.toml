[package]
name = "git-tree"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Local Git history in abstract 3D or compact 2D rails, with mouse TUI"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:glam", "dep:bytemuck"]

[dependencies]
anyhow = "1.0"
bytemuck = { version = "1.25", optional = true, features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
eframe = { version = "0.33.3", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
glam = { version = "0.30", optional = true }
gix = { version = "0.90.0", default-features = false, features = ["sha1", "sha256", "max-performance"] }
notify = "8.2"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
similar = "2.7"

[profile.release]
lto = "thin"
strip = "debuginfo"
